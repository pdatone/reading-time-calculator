<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英文閱讀時間計算器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
<style>
  /* ---- 品牌色與字體(Tailwind 之外的少量自訂) ---- */
  :root {
    --paper: #dfe8df;
    --ink: #16233a;
    --ink-soft: #61845b;
    --line: #c8d6c8;
    --hand: #e0492e;
    --hand-soft: #fdeae5;
  }
  body {
    font-family: "Noto Sans TC", "Space Grotesk", sans-serif;
    color: var(--ink);
    background-color: var(--paper);
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 36px 36px;
    background-position: -1px -1px;
  }
  .font-display { font-family: "Space Grotesk", "Noto Sans TC", sans-serif; }
  .font-mono-num { font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; }

  .text-ink { color: var(--ink); }
  .text-ink-soft { color: var(--ink-soft); }
  .text-hand { color: var(--hand); }
  .bg-hand { background-color: var(--hand); }
  .bg-hand-soft { background-color: var(--hand-soft); }
  .border-line { border-color: var(--line); }
  .border-hand { border-color: var(--hand); }

  textarea:focus, input[type="number"]:focus {
    outline: none;
    border-color: var(--ink);
    box-shadow: 0 0 0 3px rgba(22, 35, 58, 0.1);
  }
  textarea::placeholder { color: #9aa8bc; }
  input[type="range"] { accent-color: var(--hand); cursor: pointer; }

  button:focus-visible, textarea:focus-visible, input:focus-visible {
    outline: 2px solid var(--hand);
    outline-offset: 2px;
  }

  .ms-value { font-size: clamp(38px, 6vw, 54px); letter-spacing: -0.02em; line-height: 1.1; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body class="min-h-screen px-5 pt-8 pb-14">
<div class="max-w-5xl mx-auto">

  <!-- 標頭 -->
  <header class="mb-7">
    <div class="font-mono-num text-xs tracking-widest uppercase text-hand mb-2">Reading Time Calculator</div>
    <h1 class="font-display text-3xl md:text-4xl font-bold tracking-tight">英文閱讀時間計算器</h1>
    <p class="mt-2 text-ink-soft text-base leading-relaxed">貼上英文段落，設定你的 WPM，立即算出讀完所需的時間（毫秒）。</p>
  </header>

  <div class="grid grid-cols-1 md:grid-cols-5 gap-5 items-start">

    <!-- 左:文字輸入 -->
    <section class="md:col-span-3 bg-white border border-line rounded-xl p-6 shadow-sm">
      <h2 class="flex items-center gap-2 text-xs font-bold tracking-widest uppercase text-ink-soft mb-4">
        <span class="w-2 h-2 rounded-full bg-hand flex-shrink-0"></span>貼上英文段落
      </h2>
      <textarea id="text-input"
        class="w-full border-2 border-line rounded-lg px-4 py-3 bg-gray-50 text-ink leading-relaxed transition duration-150"
        style="min-height: 280px; resize: vertical; font-family: 'Space Grotesk', sans-serif; font-size: 15.5px;"
        placeholder="在這裡貼上或輸入英文文字……&#10;&#10;例如：The quick brown fox jumps over the lazy dog."
        aria-label="英文文字輸入區"></textarea>
      <div class="flex justify-between items-center mt-3 text-sm text-ink-soft">
        <span id="live-count">目前 0 個單字</span>
        <button id="clear-btn" type="button"
          class="border border-line rounded-full px-4 py-1 text-sm text-ink-soft bg-transparent transition duration-150 hover:text-ink hover:border-gray-500 cursor-pointer">
          清除文字
        </button>
      </div>
    </section>

    <!-- 右:WPM + 結果 -->
    <div class="md:col-span-2 space-y-5">

      <section class="bg-white border border-line rounded-xl p-6 shadow-sm">
        <h2 class="flex items-center gap-2 text-xs font-bold tracking-widest uppercase text-ink-soft mb-4">
          <span class="w-2 h-2 rounded-full bg-hand flex-shrink-0"></span>你的閱讀速度
        </h2>
        <div class="flex items-center gap-4 mb-3">
          <input id="wpm-input" type="number" min="1" max="2000" step="1" value="230"
            class="w-28 font-mono-num text-2xl font-semibold text-ink border-2 border-line rounded-lg px-3 py-2 bg-gray-50 text-center"
            aria-label="每分鐘閱讀字數">
          <div class="text-sm text-ink-soft leading-snug">words per minute<br>（每分鐘閱讀字數）</div>
        </div>
        <input id="wpm-slider" type="range" min="50" max="800" step="10" value="230" class="w-full mt-1" aria-label="WPM 滑桿">
        <div class="mt-3 text-xs text-ink-soft leading-relaxed bg-hand-soft rounded-lg px-3 py-2">
          參考：一般成人閱讀速度約 200–250 WPM，快速閱讀者可達 400 WPM 以上。
        </div>
      </section>

      <section class="bg-white border border-line rounded-xl p-6 shadow-sm">
        <h2 class="flex items-center gap-2 text-xs font-bold tracking-widest uppercase text-ink-soft mb-4">
          <span class="w-2 h-2 rounded-full bg-hand flex-shrink-0"></span>計算結果
        </h2>
        <div class="flex items-end flex-wrap gap-x-2 gap-y-2">
          <span id="ms-value" class="ms-value font-mono-num font-semibold text-ink inline-block border-b-4 border-hand pb-1">0</span><span class="text-base font-medium text-hand">毫秒 ms</span>
          <button id="copy-ms-btn" type="button"
            class="mb-1 border border-line rounded-full px-3 py-1 text-xs text-ink-soft bg-transparent transition duration-150 hover:text-ink hover:border-gray-500 cursor-pointer"
            aria-label="複製毫秒數值">
            複製
          </button>
        </div>
        <div class="grid grid-cols-3 gap-2 mt-5">
          <div class="bg-gray-50 border border-line rounded-lg px-3 py-3">
            <div class="text-xs text-ink-soft mb-1">單字數</div>
            <div id="word-count" class="font-mono-num text-lg font-semibold whitespace-nowrap">0</div>
          </div>
          <div class="bg-gray-50 border border-line rounded-lg px-3 py-3">
            <div class="text-xs text-ink-soft mb-1">約等於（秒）</div>
            <div id="sec-value" class="font-mono-num text-lg font-semibold whitespace-nowrap">0 s</div>
          </div>
          <div class="bg-gray-50 border border-line rounded-lg px-3 py-3">
            <div class="text-xs text-ink-soft mb-1">約等於（分:秒）</div>
            <div id="min-value" class="font-mono-num text-lg font-semibold whitespace-nowrap">0:00</div>
          </div>
        </div>
        <div id="formula" class="mt-5 pt-4 border-t border-dashed border-line font-mono-num text-xs text-ink-soft leading-relaxed break-all">
          公式：字數 ÷ WPM × 60,000 = 毫秒<br>
          <b class="text-ink font-semibold">0 ÷ 230 × 60,000 = 0 ms</b>
        </div>
      </section>

    </div>
  </div>

  <footer class="mt-9 text-center text-xs text-ink-soft">
    單字數以空白與換行分隔計算。所有計算皆在你的瀏覽器完成，文字不會被上傳。
  </footer>
</div>

<script>
(function () {
  const textInput = document.getElementById('text-input');
  const wpmInput = document.getElementById('wpm-input');
  const wpmSlider = document.getElementById('wpm-slider');
  const clearBtn = document.getElementById('clear-btn');
  const copyMsBtn = document.getElementById('copy-ms-btn');

  const msValue = document.getElementById('ms-value');
  const secValue = document.getElementById('sec-value');
  const minValue = document.getElementById('min-value');
  const wordCountEl = document.getElementById('word-count');
  const liveCount = document.getElementById('live-count');
  const formulaEl = document.getElementById('formula');

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let displayedMs = 0;   // 目前畫面上顯示的毫秒數(用於動畫)
  let animFrame = null;
  let currentMs = 0;     // 最新計算結果(複製用,不受動畫影響)
  let copyFeedbackTimer = null;

  function countWords(text) {
    const words = text.trim().split(/[\s-]+/).filter(function (w) { return w.length > 0; });
    return words.length;
  }

  function getWpm() {
    let v = parseInt(wpmInput.value, 10);
    if (isNaN(v) || v < 1) v = 1;
    if (v > 2000) v = 2000;
    return v;
  }

  function fmt(n) { return n.toLocaleString('en-US'); }

  function animateMs(target) {
    if (animFrame) cancelAnimationFrame(animFrame);
    if (reduceMotion) {
      displayedMs = target;
      msValue.textContent = fmt(target);
      return;
    }
    const start = displayedMs;
    const diff = target - start;
    const duration = 350; // ms
    const t0 = performance.now();

    function step(now) {
      const p = Math.min((now - t0) / duration, 1);
      const eased = 1 - Math.pow(1 - p, 3); // ease-out cubic
      displayedMs = Math.round(start + diff * eased);
      msValue.textContent = fmt(displayedMs);
      if (p < 1) {
        animFrame = requestAnimationFrame(step);
      } else {
        displayedMs = target;
        msValue.textContent = fmt(target);
      }
    }
    animFrame = requestAnimationFrame(step);
  }

  function update() {
    const words = countWords(textInput.value);
    const wpm = getWpm();
    const ms = Math.round((words / wpm) * 60000);
    currentMs = ms;
    const totalSec = ms / 1000;
    const mins = Math.floor(totalSec / 60);
    const secs = Math.round(totalSec % 60);

    wordCountEl.textContent = fmt(words);
    liveCount.textContent = '目前 ' + fmt(words) + ' 個單字';
    animateMs(ms);
    secValue.textContent = totalSec.toFixed(1) + ' s';
    minValue.textContent = mins + ':' + String(secs).padStart(2, '0');
    formulaEl.innerHTML =
      '公式：字數 ÷ WPM × 60,000 = 毫秒<br><b class="text-ink font-semibold">' +
      fmt(words) + ' ÷ ' + fmt(wpm) + ' × 60,000 = ' + fmt(ms) + ' ms</b>';
  }

  // 事件綁定:輸入即時更新
  textInput.addEventListener('input', update);

  wpmInput.addEventListener('input', function () {
    const v = getWpm();
    if (v >= parseInt(wpmSlider.min, 10) && v <= parseInt(wpmSlider.max, 10)) {
      wpmSlider.value = v;
    }
    update();
  });

  wpmSlider.addEventListener('input', function () {
    wpmInput.value = wpmSlider.value;
    update();
  });

  copyMsBtn.addEventListener('click', function () {
    const text = String(currentMs);

    function showCopied(ok) {
      if (copyFeedbackTimer) clearTimeout(copyFeedbackTimer);
      copyMsBtn.textContent = ok ? '已複製 ✓' : '複製失敗';
      copyFeedbackTimer = setTimeout(function () {
        copyMsBtn.textContent = '複製';
      }, 1500);
    }

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(
        function () { showCopied(true); },
        function () { showCopied(false); }
      );
    } else {
      // 舊瀏覽器 / 非安全來源(file:// 以外的 http)的備援方案
      const tmp = document.createElement('textarea');
      tmp.value = text;
      tmp.setAttribute('readonly', '');
      tmp.style.position = 'fixed';
      tmp.style.opacity = '0';
      document.body.appendChild(tmp);
      tmp.select();
      let ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      document.body.removeChild(tmp);
      showCopied(ok);
    }
  });

  clearBtn.addEventListener('click', function () {
    textInput.value = '';
    textInput.focus();
    update();
  });

  update();
})();
</script>
</body>
</html>
